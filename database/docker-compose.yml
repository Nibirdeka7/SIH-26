services:
  postgres:
    image: postgres:16
    container_name: medikiosk_postgres
    environment:
      POSTGRES_USER: medikiosk
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: medikiosk_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    container_name: medikiosk_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  postgres_data:
  mongo_data: