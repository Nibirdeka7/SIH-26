<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>MediKiosk | Physician OPD Dashboard</title>
    <meta name="description" content="Structured pre-consultation summary review, live OPD queue, and FHIR ABDM sync dashboard for physicians." />
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Source+Sans+3:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              display: ['Playfair Display', 'serif'],
              body: ['Source Sans 3', 'sans-serif'],
            },
            colors: {
              background: '#faf9f5',
              primary: '#18241c',
              'primary-container': '#2d3a31',
              secondary: '#8c9a84',
              'secondary-container': '#d8e7ce',
              terracotta: '#c27b66',
              clay: '#dccfc2',
              stoneborder: '#e6e2da',
            }
          }
        }
      }

  </head>
  <body class="bg-[#faf9f5] font-body text-[#18241c] antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
